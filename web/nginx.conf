# Static landing pages and agent cards for the fictional companies.
# S4 adds one server block per company (cafe.test, roaster.test, supplier-b.test, ...), each serving
# its landing page and /.well-known/agent-card.json. Until then every name gets the placeholder page.
server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
