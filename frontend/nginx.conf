# Serves the React app and forwards each desk's API, so the browser sees one origin and CORS stays closed.
# Only /api/** is forwarded; the desks' /actuator endpoints are never reachable from the browser.

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;

    # Docker's DNS, re-asked every 10 s: a desk that restarts can come back on a new IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    # Long enough for SSE streams; the desks send a heartbeat every 25 seconds.
    proxy_read_timeout 1h;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /cafe/api/ {
        set $desk http://cafe:8080;
        rewrite ^/cafe(/api/.*)$ $1 break;
        proxy_pass $desk;
    }

    # The SSE stream: no buffering, so events reach the browser as they happen.
    location = /cafe/api/events {
        set $desk http://cafe:8080;
        proxy_buffering off;
        proxy_pass $desk/api/events;
    }

    location /roaster/api/ {
        set $desk http://roaster:8080;
        rewrite ^/roaster(/api/.*)$ $1 break;
        proxy_pass $desk;
    }

    # The SSE stream: no buffering, so events reach the browser as they happen.
    location = /roaster/api/events {
        set $desk http://roaster:8080;
        proxy_buffering off;
        proxy_pass $desk/api/events;
    }

    location / {
        try_files $uri /index.html;
    }
}
