# Settings for every desk. Per-desk values come from DESK_* variables in docker-compose.yml, secrets from .env.
spring:
  application:
    name: trade-desk
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/${desk.id}}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${POSTGRES_PASSWORD}
  flyway:
    locations: classpath:db/migration
  # OpenAI through Spring AI, chat only. The key never reaches a prompt or a tool; OpenAiLlm reports "not configured"
  # (503) instead of failing at startup when it's missing, so the desk still runs without it.
  ai:
    model:
      chat: openai
      embedding: none
      image: none
      audio:
        speech: none
        transcription: none
      moderation: none
    openai:
      api-key: ${OPENAI_API_KEY:not-configured}
      chat:
        model: ${OPENAI_MODEL:gpt-6-luna}

server:
  port: 8080
  servlet:
    session:
      cookie:
        # Every desk sits behind the same origin (localhost:8080), so each needs its own cookie name.
        name: ${desk.id}_SESSION
        http-only: true
        same-site: lax

# PayPal SANDBOX REST app, for desks that send invoices. The base URL is a constant in PayPalClient, not a setting.
paypal:
  client-id: ${PAYPAL_CLIENT_ID:}
  client-secret: ${PAYPAL_CLIENT_SECRET:}
  sandbox-buyer-email: ${PAYPAL_SANDBOX_BUYER_EMAIL:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
